name: Release

on:
  workflow_run:
    workflows: ["CI - Releases and Main"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # need full history for tags

      - name: Compute version tag
        id: version
        run: |
          TODAY=$(date -u +"%Y.%m.%d")
          # List existing tags for today, extract build numbers, find max
          LAST_BUILD=$(git tag -l "${TODAY}-*" | sed "s/${TODAY}-//" | sort -n | tail -1)
          if [ -z "$LAST_BUILD" ]; then
            BUILD=1
          else
            BUILD=$((LAST_BUILD + 1))
          fi
          TAG="${TODAY}-${BUILD}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Trigger build on the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_main.yml --ref "${{ steps.version.outputs.tag }}"
